; PlatformIO Main Project Configuration File
; MCP-Inspired Time Tracker Device

[platformio]
default_envs = esp32c3_mcp
src_dir = main

[env:esp32c3_mcp]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf

; ESP-IDF specific configuration
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Build flags
build_flags = 
	-DCORE_DEBUG_LEVEL=2
	-O2
	-DESP_SYSTEM_CHECK_INT_LEVEL=5
	-I tools/rfid_tool/rc522/internal
    -DDEBUG_FLOW_TESTING


; Include tools directory and managed components (removed components - now self-contained)
lib_extra_dirs = 
	tools
	managed_components