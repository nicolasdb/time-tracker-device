; PlatformIO Main Project Configuration File
; MCP-Inspired Time Tracker Device

[platformio]
default_envs = esp32c3_mcp
src_dir = main
data_dir = data

[env:esp32c3_mcp]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf

; ESP-IDF specific configuration
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Constitutional Build Flags for Production
build_flags = 
	-DCORE_DEBUG_LEVEL=0               ; Minimal logging for production
	-Os                                ; Size optimization (not speed -O2)
	-I tools/rfid_tool/rc522/internal  ; RFID tool includes
	; CRITICAL: ESP-IDF lwIP component defaults override sdkconfig.defaults
	; Only these 2 values need compiler-flag override (others work from sdkconfig.defaults)
	-UCONFIG_LWIP_TCP_MSL -DCONFIG_LWIP_TCP_MSL=2000         ; TCP MSL: 2 seconds (not 60!)
	-UCONFIG_LWIP_MAX_SOCKETS -DCONFIG_LWIP_MAX_SOCKETS=16   ; Socket pool: 16 (not 10)

; ESP-IDF Configuration Override (Force lwIP socket fixes)
board_build.sdkconfig = sdkconfig.defaults


; Include tools directory
lib_extra_dirs = 
	tools